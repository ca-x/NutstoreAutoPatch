name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
      - uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: '6.x'
      - name: Restore packages
        shell: pwsh
        run: |
          nuget restore NutstoreAutoPatch.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $LASTEXITCODE" }
      - name: Build, test and package
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $version = if ($env:BUILD_REF_TYPE -eq 'tag') { $env:BUILD_REF } else { 'build-' + $env:BUILD_SHA.Substring(0, 12) }
          ./scripts/build.ps1 -Version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NutstoreAutoPatch-windows
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NutstoreAutoPatch-windows
          path: release-assets
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 2) { throw 'Expected one binary ZIP and one checksum file.' }
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --repo $env:GH_REPO --clobber
          } else {
            $flags = @('--verify-tag', '--generate-notes', '--title', $env:RELEASE_TAG, '--repo', $env:GH_REPO)
            if ($env:RELEASE_TAG.Contains('-')) { $flags += '--prerelease' }
            gh release create $env:RELEASE_TAG @assets @flags
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $LASTEXITCODE" }
